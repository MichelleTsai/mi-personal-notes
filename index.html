<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讀書筆記目錄</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .container {
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    max-width: 600px;
    width: 100%;
    padding: 60px 40px;
    text-align: center;
  }
  
  h1 {
    font-size: 32px;
    color: #333;
    margin-bottom: 16px;
    font-weight: 700;
  }
  
  .subtitle {
    font-size: 16px;
    color: #666;
    margin-bottom: 48px;
    line-height: 1.6;
  }
  
  .chapters {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .chapter-item {
    display: block;
    padding: 16px 24px;
    background: #f8f9fa;
    border: 2px solid transparent;
    border-radius: 10px;
    text-decoration: none;
    color: #333;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .chapter-item:hover {
    background: #667eea;
    color: white;
    border-color: #667eea;
    transform: translateX(8px);
  }
  
  .chapter-icon {
    margin-right: 12px;
    font-size: 20px;
  }
  
  .footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid #eee;
    color: #999;
    font-size: 12px;
  }
  
  @media (max-width: 600px) {
    .container {
      padding: 40px 24px;
    }
    
    h1 {
      font-size: 24px;
    }
    
    .subtitle {
      font-size: 14px;
      margin-bottom: 32px;
    }
    
    .chapter-item {
      padding: 14px 20px;
      font-size: 15px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>📚 讀書筆記</h1>
    <p class="subtitle">Michelle 的個人閱讀筆記與知識整理</p>
    
    <div class="chapters">
      <a href="ch2.html" class="chapter-item">
        <span class="chapter-icon">📊</span>第2章：評估企業的真實身價
      </a>
      <!-- 後續可以在此添加更多章節 -->
    </div>
    
    <div class="footer">
      <p>持續更新中...</p>
    </div>
  </div>
</body>
</html>
