<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michelle 的學習筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F0E8;
  --cream-soft:#FBF8F3;
  --caramel:#8B6B4A;
  --caramel-light:#C9AD8F;
  --sage:#7A8C72;
  --slate:#7A8C9A;
  --brick:#C4756A;
  --ink:#3A332C;
  --ink-soft:#73685B;
  --line:#E4D8C9;
}

*{box-sizing:border-box;}
html,body{margin:0;}
body{
  font-family:'Noto Sans TC',sans-serif;
  font-size:17px;line-height:1.8;color:var(--ink);
  background:var(--cream);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:48px 20px;
}
h1,h2{font-family:'Noto Serif TC',serif;font-weight:700;color:var(--caramel);margin:0;}

.hub{max-width:880px;width:100%;text-align:center;}
.eyebrow{
  display:inline-block;font-size:13px;font-weight:600;letter-spacing:.22em;
  color:var(--sage);text-transform:uppercase;margin-bottom:12px;
}
.hub h1{font-size:clamp(28px,4vw,40px);margin-bottom:8px;}
.hub p.sub{color:var(--ink-soft);font-size:15px;margin:0 0 44px;}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:680px){.card-grid{grid-template-columns:1fr;}}

.entry-card{
  display:flex;flex-direction:column;justify-content:space-between;
  text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:32px 30px;min-height:200px;
  text-decoration:none;color:var(--ink);
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.entry-card:hover{
  transform:translateY(-4px);
  border-color:var(--caramel);
  box-shadow:0 14px 28px rgba(139,107,74,.14);
}
.entry-card:focus-visible{
  outline:2px solid var(--caramel);outline-offset:3px;
}
.entry-card .tag{
  display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:14px;
}
.entry-card.etf .tag{color:var(--slate);}
.entry-card.book .tag{color:var(--sage);}
.entry-card h2{font-size:20px;line-height:1.55;}
.entry-card .go{
  margin-top:24px;font-size:14px;font-weight:600;color:var(--caramel);
  display:flex;align-items:center;gap:6px;
}
.entry-card .go svg{width:16px;height:16px;transition:transform .2s ease;}
.entry-card:hover .go svg{transform:translateX(4px);}

@media (prefers-reduced-motion:reduce){
  .entry-card{transition:none;}
  .entry-card:hover{transform:none;}
  .entry-card .go svg{transition:none;}
  .entry-card:hover .go svg{transform:none;}
}
</style>
</head>
<body>
  <div class="hub">
    <span class="eyebrow">Michelle's Notes</span>
    <h1>學習筆記</h1>
    <p class="sub">投資研究與讀書筆記的整理空間</p>

    <div class="card-grid">
      <a class="entry-card etf" href="00631L/index.html">
        <div>
          <span class="tag">ETF 分析</span>
          <h2>元大台灣50正2（00631L.TW）分析</h2>
        </div>
        <span class="go">前往
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </a>

      <a class="entry-card book" href="finance-1/index.html">
        <div>
          <span class="tag">讀書筆記</span>
          <h2>財報筆記｜大會計師教你從財報數字看懂經營本質</h2>
        </div>
        <span class="go">前往
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </a>
    </div>
  </div>
</body>
</html>
