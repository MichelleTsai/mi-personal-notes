<script>
// Centralized nav handling: click, keyboard, and scroll highlight
const navItems = Array.from(document.querySelectorAll('.nav-item'));
const sections = Array.from(document.querySelectorAll('section[id]'));

function activateNavItem(item) {
  navItems.forEach(i => {
    i.classList.remove('active');
    i.removeAttribute('aria-current');
  });
  item.classList.add('active');
  item.setAttribute('aria-current', 'page');
}

navItems.forEach(item => {
  // click handler
  item.addEventListener('click', function(e) {
    // allow normal anchor behavior fallback but prevent jump to enable smooth scroll
    e.preventDefault();
    const targetId = this.getAttribute('data-scroll');
    const target = document.getElementById(targetId);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      activateNavItem(this);
      // move focus to the target for accessibility
      target.setAttribute('tabindex', '-1');
      target.focus({preventScroll:true});
    }
  });

  // keyboard activation (Enter / Space)
  item.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      this.click();
    }
  });
});

// Highlight nav based on scroll position
window.addEventListener('scroll', () => {
  let current = '';
  sections.forEach(s => {
    const rect = s.getBoundingClientRect();
    if (rect.top <= 96) { // header offset
      current = s.id;
    }
  });
  if (current) {
    const match = navItems.find(i => i.getAttribute('data-scroll') === current);
    if (match) activateNavItem(match);
  }
}, { passive: true });

// Case toggle (existing behavior)
function togCase(hd) {
  const bd = hd.nextElementSibling;
  const ch = hd.querySelector('.case-chev');
  const open = bd.classList.contains('open');
  bd.classList.toggle('open', !open);
  ch && ch.classList.toggle('open', !open);
}
</script>
