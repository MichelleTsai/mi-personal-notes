<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第1章筆記：對數字有感</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cr:#F5F0E8; --cr2:#EDE5D8; --cr3:#E2D7C6; --cr4:#D4C8B4; --cr5:#C0B09A;
    --ct:#2C2420; --ct2:#5C4A3A; --ct3:#8B7560; --ct4:#B09A82;
    --ca:#8B6B4A; --ca2:#6B4F32; --ca3:#4A3320; --ca-l:#F0E4D4; --ca-ll:#FAF5EE;
    --cg:#7A8C72; --cg2:#5A6C52; --cg-l:#EAF0E6;
    --cb:#7A8C9A; --cb2:#5A6C7A; --cb-l:#E6EDF2;
    --cw:#C4756A; --cw2:#A05548; --cw-l:#F5EAE8;
    --radius:10px; --radius-lg:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--cr);color:var(--ct);line-height:1.72;font-size:17px;font-weight:400;-webkit-font-smoothing:antialiased}
  h2,h3{font-family:'Noto Serif TC',serif;font-weight:700;letter-spacing:.02em}
  strong,b{font-weight:600;color:var(--ca2)}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--cr2)}::-webkit-scrollbar-thumb{background:var(--cr4);border-radius:3px}

  .sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:var(--ca-ll);border-right:1px solid var(--cr4);overflow-y:auto;z-index:100;padding:0 0 2rem}
  .sidebar-logo{padding:1.4rem 1.2rem 1rem;border-bottom:1px solid var(--cr4);background:var(--ca-l)}
  .sidebar-logo h1{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--ca2);line-height:1.5}
  .sidebar-logo p{font-size:11px;color:var(--ct4);margin-top:4px}
  .nav-section{padding:.4rem 0}
  .nav-section-label{font-size:10px;font-weight:600;color:var(--ct4);text-transform:uppercase;letter-spacing:.12em;padding:.6rem 1.2rem .3rem}
  .nav-item{display:block;padding:.5rem 1rem .5rem 1.3rem;font-size:14px;color:var(--ct2);text-decoration:none;border-left:2px solid transparent;transition:all .15s;cursor:pointer}
  .nav-item:hover{color:var(--ct);background:var(--cr2)}
  .nav-item.active{color:var(--ca2);border-left-color:var(--ca);background:var(--ca-l);font-weight:600}
  .main{margin-left:260px;padding:2.5rem 3.5rem 5rem}

  .page-hero{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--cr4)}
  .hero-tag{font-size:11px;font-weight:600;color:var(--ca2);background:var(--ca-l);padding:4px 13px;border-radius:20px;display:inline-block;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.08em}
  .page-hero h2{font-size:30px;font-weight:700;color:var(--ct);margin-bottom:.4rem}
  .page-hero p{font-size:16px;color:var(--ct3)}

  .section{margin-bottom:2.5rem;scroll-margin-top:1.5rem}
  .section-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--cr4)}
  .section-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--ca)}
  .section-header h3{font-size:21px;font-weight:700;color:var(--ct);flex:1}
  .section-page{font-size:13px;color:var(--ct4);letter-spacing:.04em}

  .block{margin-bottom:1.25rem}
  .block-title{font-size:16px;font-weight:600;color:var(--ca2);margin-bottom:.5rem}
  .block-body{font-size:17px;color:var(--ct);line-height:1.78}

  .hl{border-left:2.5px solid var(--ca);background:var(--ca-ll);padding:12px 16px;margin:12px 0;font-size:16px;line-height:1.7;color:var(--ct2)}
  .hl.sage{border-left-color:var(--cg);background:var(--cg-l);color:var(--cg2)}
  .hl.amber{border-left-color:#A07838;background:#F5ECD8;color:#6B4F20}
  .hl.red{border-left-color:var(--cw);background:var(--cw-l);color:var(--cw2)}
  .hl.blue{border-left-color:var(--cb);background:var(--cb-l);color:var(--cb2)}
  .warn-box{background:var(--cw-l);border-left:2.5px solid var(--cw);padding:13px 16px;margin:12px 0;font-size:16px;color:var(--cw2);line-height:1.7}
  .good-box{background:var(--cg-l);border-left:2.5px solid var(--cg);padding:13px 16px;margin:12px 0;font-size:16px;color:var(--cg2);line-height:1.7}
  .caution-box{background:#F5ECD8;border-left:2.5px solid #A07838;padding:13px 16px;margin:12px 0;font-size:16px;color:#6B4F20;line-height:1.7}

  .tbl-wrap{overflow-x:auto;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{background:var(--cr2);padding:10px 13px;text-align:left;font-weight:600;color:var(--ct3);font-size:13px;border-bottom:1px solid var(--cr4);text-transform:uppercase;letter-spacing:.05em}
  td{padding:10px 13px;border-bottom:1px solid var(--cr3);color:var(--ct);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--ca-ll)}

  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .ccard{border:1px solid var(--cr4);border-radius:var(--radius);padding:13px 15px;background:var(--ca-ll)}
  .ccard-title{font-size:15px;font-weight:600;margin-bottom:7px;color:var(--ca2)}
  .ccard-body{font-size:15px;color:var(--ct2);line-height:1.65}

  .steps{margin:12px 0}
  .step{display:flex;gap:12px;margin-bottom:11px;align-items:flex-start}
  .step-num{width:27px;height:27px;border-radius:50%;background:var(--ca-l);color:var(--ca2);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step-text{font-size:16px;color:var(--ct);line-height:1.7;flex:1}

  .case-strip{border:1px solid var(--cr4);border-radius:var(--radius);margin:9px 0;overflow:hidden}
  .case-hd{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--cr2);cursor:pointer;user-select:none;transition:background .15s}
  .case-hd:hover{background:var(--cr3)}
  .case-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .case-title{font-size:15px;font-weight:500;color:var(--ct);flex:1}
  .case-tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;border:1px solid transparent}
  .tag-ok{background:var(--cg-l);color:var(--cg2);border-color:#A8C4A0}
  .tag-warn{background:var(--cw-l);color:var(--cw2);border-color:#D8A098}
  .tag-info{background:var(--cb-l);color:var(--cb2);border-color:#A8BCC8}
  .tag-neutral{background:var(--cr2);color:var(--ct3);border-color:var(--cr4)}
  .case-chev{font-size:11px;color:var(--ct4);transition:transform .2s}
  .case-chev.open{transform:rotate(180deg)}
  .case-bd{padding:14px 15px;font-size:16px;line-height:1.72;color:var(--ct);display:none;border-top:1px solid var(--cr4);background:var(--ca-ll)}
  .case-bd.open{display:block}

  .div{border:none;border-top:1px solid var(--cr4);margin:1.5rem 0}
  .formula{background:var(--cr2);border-radius:var(--radius);padding:14px 20px;margin:12px 0;text-align:center;font-size:20px;font-weight:700;color:var(--ca2);font-family:'Noto Serif TC',serif;border:1px solid var(--cr4)}

  .mr{display:flex;align-items:center;gap:10px;margin:7px 0}
  .ml{font-size:13px;color:var(--ct3);width:160px;flex-shrink:0;text-align:right}
  .mbg{flex:1;height:9px;background:var(--cr3);border-radius:5px;overflow:hidden}
  .mf{height:100%;border-radius:5px}
  .mv{font-size:13px;font-weight:600;width:52px;flex-shrink:0}

  .stat-row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
  .stat{background:var(--cr2);border:1px solid var(--cr4);border-radius:var(--radius);padding:10px 14px;flex:1;min-width:100px}
  .stat-label{font-size:12px;color:var(--ct4);text-transform:uppercase;letter-spacing:.05em}
  .stat-val{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:700;margin-top:3px}

  .diagram{margin:1.25rem 0;background:var(--ca-ll);border:1px solid var(--cr4);border-radius:var(--radius-lg);padding:1.5rem}
  .diagram-title{font-size:11px;font-weight:600;color:var(--ct4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:1.1rem}

  .flow-row{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:10px 0}
  .flow-box{border:1px solid var(--cr4);border-radius:var(--radius);padding:12px 14px;background:var(--ca-ll);font-size:14px;text-align:center;flex:1;min-width:120px}
  .flow-box.highlight{background:var(--ca-l);border-color:var(--ca);font-weight:600;color:var(--ca2)}
  .flow-box.safe{background:var(--cg-l);border-color:var(--cg);color:var(--cg2);font-weight:600}
  .flow-box.danger{background:var(--cw-l);border-color:var(--cw);color:var(--cw2);font-weight:600}
  .flow-arrow{font-size:18px;color:var(--ct4);padding:0 8px;flex-shrink:0}

  .badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;margin-right:4px;vertical-align:middle;font-weight:500;border:1px solid transparent}
  .bp{background:var(--ca-l);color:var(--ca2);border-color:var(--cr5)}
  .bt{background:var(--cg-l);color:var(--cg2);border-color:#A8C4A0}
  .ba{background:#F5ECD8;color:#6B4F20;border-color:#C8A870}
  .br{background:var(--cw-l);color:var(--cw2);border-color:#D8A098}
  .bb{background:var(--cb-l);color:var(--cb2);border-color:#A8BCC8}


  /* sidebar toggle */
  .sidebar-toggle{position:fixed;top:50%;left:260px;transform:translateY(-50%);z-index:200;width:18px;height:48px;background:var(--ca-l);border:1px solid var(--cr4);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ca2);font-weight:bold;transition:all .2s}
  .sidebar-toggle:hover{background:var(--ca);color:#fff;}
  .sidebar{transition:transform .25s ease;}
  .sidebar.collapsed{transform:translateX(-260px);}
  .main{transition:margin-left .25s ease;}
  .main.expanded{margin-left:0;}
  @media(max-width:700px){
    .sidebar{display:none}
    .main{margin-left:0;padding:1.25rem}
    .cgrid,.flow-row{flex-direction:column}
    .flow-arrow{transform:rotate(90deg)}
  }

  .home-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ct3);text-decoration:none;padding:5px 13px;border-radius:20px;border:1px solid var(--cr4);background:var(--ca-l)}
  .home-btn:hover{background:var(--ca-l);color:var(--ca2);border-color:var(--cr5);}
  .home-btn-sidebar{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ct3);text-decoration:none;padding:.55rem 1rem .55rem 1.3rem;border-top:1px solid var(--cr4);margin-top:.5rem;transition:all .15s;cursor:pointer}
  .home-btn-sidebar:hover{color:var(--ca2);background:var(--ca-l);}
</style>
</head>

</nav>

</body>
</html>
